
version: '3.8'

services:
  db:
    image: postgres:16
    container_name: my-exam
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: examination_02
    ports:
      - "5433:5432"
    volumes:
      - data:/var/lib/postgresql/data

  app:
    build: .
    container_name: my_exam
    restart: always
    ports:
      - "4077:3000"
    env_file:
      - .env
    depends_on:
      - db
    command: >
      sh -c "
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run start:prod
      "

volumes:
  data:

